name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint, build, and test
        run: |
          npm run lint
          npm run build
          npm test
      - name: Use npm with trusted publishing support
        run: npm install -g npm@11.21.0
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
